baseURL: 'https://localhost/'
languageCode: 'zh-CN'
title: '似水年华'
theme: 'hugo-PaperMod-8.0'
buildDrafts: false
buildFuture: false
buildExpired: false
menu:
  main:
    - identifier: "home"
      name: "首页"
      url: "/"
      weight: 10
    
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 20
    
    - identifier: "archives"
      name: "归档"
      url: "/archives/"
      weight: 30
    
    - identifier: "tags"
      name: "标签"
      url: "/tags/"
      weight: 40
    
    - identifier: "categories"
      name: "分类"
      url: "/categories/"
      weight: 50

    - identifier: "search"
      name: "搜索"
      url: "/search/"
      weight: 70
    
taxonomies:
  tag: "tags"
  category: "categories"
Params:
  footer:
    powered: false
  ShowReadingTime: true
  ShowCoverInList: true  # 在文章列表页显示封面图片
  ShowCoverInSingle: true  # 在单篇文章页显示封面图片
  ShowToc: true
  TocOpen: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  comments: true
  DateFormat: "2006-01-02 15:04:05"
  # 显示菜单按钮
  showMenuItems: true
  ShowWordCount: true
  defaultTheme: "auto"
  ShowCodeCopyButtons: true
  ShowFullTextinRSS: true
  ShowReadingTime: true
  ShowWordCount: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  timeZone: "Asia/Shanghai"
  # 启用搜索
  enableSearch: true
  search:
    enable: true
    type: fusejs # 使用 fusejs 作为搜索引擎
    limit: 10 # 搜索结果显示数量
    placeholder: 搜索...

caches:
  images:
    dir: :cacheDir/images

outputs:
  home:
    - HTML
    - RSS
    - JSON
    # - SearchIndex # 添加搜索索引输出

tags:
  - responsive
  - simple
  - clean
  - light
  - dark
  - blog
  - minimalist
  - highlight.js
  - search

features:
  - responsive
  - single-column
  - blog
  - cover-image
  - table-of-contents
  - opengraph
  - highlight.js
  - favicon
  - archive
  - share-icons
  - cover
  - multilingual
  - social-icons
  - minified-assets
  - theme-toggle
  - menu-location-indicator
  - scroll-to-top
  - search
