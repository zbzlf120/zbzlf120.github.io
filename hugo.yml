baseURL: 'https://localhost/'
languageCode: 'zh-CN'
title: '似水年华'
theme: 'hugo-PaperMod-8.0'
menu:
  main:
    - identifier: "home"
      name: "首页"
      url: "/"
      weight: 10
    
    - identifier: "posts"
      name: "文章"
      url: "/posts/"
      weight: 20
    
    - identifier: "archives"
      name: "归档"
      url: "/archives/"
      weight: 30
    
    - identifier: "tags"
      name: "标签"
      url: "/tags/"
      weight: 40
    
    - identifier: "categories"
      name: "分类"
      url: "/categories/"
      weight: 50
    
taxonomies:
  tag: "tags"
  category: "categories"
Params:
  footer:
    powered: false
  ShowReadingTime: true
  ShowToc: true
  TocOpen: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  comments: true
  # 启用搜索
  enableSearch: true

caches:
  images:
    dir: :cacheDir/images
# 显示菜单按钮
  showMenuItems: true
  ShowWordCount: true
  defaultTheme: "auto"
  ShowCodeCopyButtons: true
  ShowFullTextinRSS: true
  ShowReadingTime: true
  ShowWordCount: true
  DateFormat: "2006-01-02 15:04:05"
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  timeZone: "Asia/Shanghai"
outputs:
  home:
    - HTML
    - RSS
    - JSON